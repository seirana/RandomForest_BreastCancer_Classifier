[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breast-cancer-baseline"
version = "0.2.0"
description = "Reproducible out-of-fold evaluation of logistic regression and random forest on sklearn's breast-cancer dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<4",
  "scikit-learn>=1.3,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
breast-cancer-baseline = "breast_cancer_classifier.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [
  ".git",
  ".venv",
  "artifacts",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E501"]
